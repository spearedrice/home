<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>faq</title>
    <style>
        body { margin:0; padding:24px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:white; color:#111; line-height:1.5; }
        h1 { font-size:28px; margin:0 0 24px 0; }
        .qa { background:#f8f8f8; padding:16px; border-radius:12px; margin-bottom:16px; }
        strong { display:block; margin-bottom:6px; }
    </style>
</head>
<body>
    <h1>faq</h1>
    <div class="qa">
        <strong>what do you make?</strong>
        <p>literally anything when I'm bored.</p>
    </div>
    <div class="qa">
        <strong>can i donate?</strong>
        <p>yes. paypal and crypto are accepted.</p>
    </div>
    <div class="qa">
        <strong>why is your paypal name that</strong>
        <p>i had someone else make it for me they used a fabricated last name</p>
    </div>
</body>
</html>
