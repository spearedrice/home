<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>work</title>
    <style>
        body { 
            margin:0; 
            padding:24px; 
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; 
            background:white; 
            color:#111; 
            line-height:1.5; 
        }
        h1 { 
            font-size:28px; 
            margin:0 0 20px 0; 
        }
        .card { 
            background:#f8f8f8; 
            padding:16px; 
            border-radius:12px; 
            margin-bottom:20px; 
        }
        img { 
            width: 32px; 
            height: 32px; 
            image-rendering: pixelated; 
            margin-bottom: 8px; 
        }
        strong { 
            display:block; 
            font-size:16px; 
            margin-bottom:4px; 
        }
    </style>
</head>
<body>
    <h1>work</h1>
    
    <div class="card">
        <img src="../assets/work/asian.png" alt="minecraft mod">
        <strong>minecraft mod</strong>
        <p>small mod i made</p>
    </div>

    <div class="card">
        <img src="../assets/work/site.png" alt="this website">
        <strong>this website</strong>
        <p>you're looking at it right now</p>
    </div>
</body>
</html>
